<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580">
  <!-- Background -->
  <rect width="900" height="580" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#212529">
    Tidal Voice Assistant - Hybrid Architecture
  </text>

  <!-- User -->
  <circle cx="70" cy="220" r="35" fill="#6c757d" stroke="#495057" stroke-width="2"/>
  <text x="70" y="230" font-family="Arial, sans-serif" font-size="30" text-anchor="middle">👤</text>
  <text x="70" y="275" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">User</text>

  <!-- Voice command speech bubble -->
  <rect x="110" y="150" width="130" height="45" rx="8" fill="#e8f5e9" stroke="#28a745" stroke-width="1.5"/>
  <text x="175" y="170" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2e7d32">"Okay música,</text>
  <text x="175" y="185" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2e7d32">reproduce Queen"</text>
  <!-- Speech bubble pointer -->
  <polygon points="120,195 110,210 130,195" fill="#e8f5e9" stroke="#28a745" stroke-width="1.5"/>

  <!-- Raspberry Pi 5 Container -->
  <rect x="250" y="70" width="220" height="450" rx="12" fill="#fff" stroke="#c62828" stroke-width="3"/>
  <rect x="250" y="70" width="220" height="35" rx="12" fill="#c62828"/>
  <text x="360" y="93" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    🍓 Raspberry Pi 5
  </text>

  <!-- Microphone -->
  <circle cx="360" cy="145" r="22" fill="#17a2b8" stroke="#117a8b" stroke-width="2"/>
  <text x="360" y="152" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#fff">🎤</text>
  <text x="360" y="182" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">Microphone</text>

  <!-- Arrow: User to Microphone -->
  <path d="M 105 220 L 250 220 L 250 145 L 335 145" stroke="#28a745" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>

  <!-- Arrow: Microphone to Wake Word -->
  <line x1="360" y1="190" x2="360" y2="210" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Wake Word Detection -->
  <rect x="275" y="215" width="170" height="55" rx="8" fill="#28a745" stroke="#1e7e34" stroke-width="2"/>
  <text x="360" y="237" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Wake Word Detection</text>
  <text x="360" y="253" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#c8e6c9">Vosk · "Okay música"</text>
  <text x="360" y="265" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#a5d6a7">LOCAL · Offline</text>

  <!-- Arrow: Wake Word to Cloud Recognition -->
  <line x1="360" y1="270" x2="360" y2="285" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cloud Speech Recognition (Google) -->
  <rect x="275" y="290" width="170" height="55" rx="8" fill="#4285f4" stroke="#1a73e8" stroke-width="2"/>
  <text x="360" y="310" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Command Recognition</text>
  <text x="360" y="326" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#bbdefb">Google Speech API</text>
  <text x="360" y="340" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#90caf9">CLOUD · Accurate</text>

  <!-- Arrow: Cloud Recognition to Command Parser -->
  <line x1="360" y1="345" x2="360" y2="360" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Command Parser -->
  <rect x="275" y="365" width="170" height="45" rx="8" fill="#7b1fa2" stroke="#4a148c" stroke-width="2"/>
  <text x="360" y="385" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Command Parser</text>
  <text x="360" y="400" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e1bee7">song · artist · album</text>

  <!-- Arrow: Command Parser to Tidal Player -->
  <line x1="360" y1="410" x2="360" y2="425" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tidal Player -->
  <rect x="275" y="430" width="170" height="50" rx="8" fill="#e65100" stroke="#bf360c" stroke-width="2"/>
  <text x="360" y="452" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Tidal Player</text>
  <text x="360" y="468" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffe0b2">PyChromecast · TTS</text>

  <!-- TTS Announcement -->
  <rect x="275" y="485" width="170" height="25" rx="4" fill="#ffecb3" stroke="#ff9800" stroke-width="1"/>
  <text x="360" y="502" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#e65100">🔊 "Reproduciendo X de Y"</text>

  <!-- Google Cloud Box -->
  <rect x="550" y="250" width="150" height="95" rx="8" fill="#e3f2fd" stroke="#4285f4" stroke-width="2"/>
  <text x="625" y="275" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1565c0">☁️ Google Cloud</text>
  <text x="625" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1976d2">Speech-to-Text API</text>
  <text x="625" y="315" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#42a5f5">Free tier · No API key</text>
  <text x="625" y="335" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#64b5f6">High accuracy for</text>
  <text x="625" y="347" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#64b5f6">artist/song names</text>

  <!-- Arrow: Pi to Google Cloud -->
  <path d="M 445 317 L 550 317" stroke="#4285f4" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="497" y="310" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#4285f4">Audio</text>

  <!-- TIDAL API Box -->
  <rect x="550" y="70" width="150" height="90" rx="8" fill="#000" stroke="#333" stroke-width="2"/>
  <text x="625" y="105" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">TIDAL</text>
  <text x="625" y="125" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#bbb">Music Streaming API</text>
  <text x="625" y="145" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#888">Search · Stream URLs</text>

  <!-- Arrow: Tidal Player to TIDAL API -->
  <path d="M 445 455 L 500 455 L 500 115 L 550 115" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="508" y="285" font-family="Arial, sans-serif" font-size="9" fill="#666" transform="rotate(-90,508,285)">API Requests</text>

  <!-- Google Nest Mini -->
  <rect x="550" y="380" width="150" height="100" rx="8" fill="#4285f4" stroke="#1a73e8" stroke-width="2"/>
  <text x="625" y="410" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">Google</text>
  <text x="625" y="428" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">Nest Mini</text>
  <text x="625" y="448" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#c5cae9">Chromecast Receiver</text>
  <text x="625" y="468" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">🔊</text>

  <!-- Arrow: Tidal Player to Nest Mini -->
  <path d="M 445 465 L 480 465 L 480 430 L 550 430" stroke="#4285f4" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="462" y="448" font-family="Arial, sans-serif" font-size="8" fill="#4285f4">Cast</text>

  <!-- Music output -->
  <path d="M 700 430 L 780 430" stroke="#4285f4" stroke-width="2" fill="none" stroke-dasharray="6,3"/>
  <text x="800" y="420" font-family="Arial, sans-serif" font-size="28">🎵</text>
  <text x="800" y="450" font-family="Arial, sans-serif" font-size="11" fill="#495057">Music!</text>

  <!-- Key Features Box -->
  <rect x="730" y="200" width="155" height="115" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="807" y="220" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2e7d32">✨ Hybrid Benefits</text>
  <text x="738" y="240" font-family="Arial, sans-serif" font-size="9" fill="#388e3c">✓ Offline Wake Word</text>
  <text x="738" y="255" font-family="Arial, sans-serif" font-size="9" fill="#388e3c">✓ Accurate Commands</text>
  <text x="738" y="270" font-family="Arial, sans-serif" font-size="9" fill="#388e3c">✓ Free Google API</text>
  <text x="738" y="285" font-family="Arial, sans-serif" font-size="9" fill="#388e3c">✓ Spanish + Intl Artists</text>
  <text x="738" y="300" font-family="Arial, sans-serif" font-size="9" fill="#388e3c">✓ ~5-8s Response Time</text>

  <!-- Network indicator -->
  <rect x="730" y="70" width="155" height="35" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="807" y="92" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#e65100">📡 WiFi Required</text>

  <!-- Architecture Labels -->
  <rect x="730" y="125" width="155" height="55" rx="6" fill="#fce4ec" stroke="#ec407a" stroke-width="1.5"/>
  <text x="807" y="145" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#c2185b">🏗️ Hybrid Architecture</text>
  <text x="807" y="162" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#d81b60">Wake: Vosk (Local)</text>
  <text x="807" y="175" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#d81b60">Commands: Google (Cloud)</text>

  <!-- Footer -->
  <text x="450" y="560" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#9e9e9e">
    Hybrid speech recognition: Vosk wake word (offline) + Google Speech API (accurate commands)
  </text>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#28a745"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4285f4"/>
    </marker>
  </defs>
</svg>
