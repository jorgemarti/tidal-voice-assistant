<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#212529">
    Tidal Voice Assistant Architecture
  </text>

  <!-- Raspberry Pi 5 Container -->
  <rect x="50" y="80" width="350" height="450" rx="10" fill="#fff" stroke="#6c757d" stroke-width="2"/>
  <text x="225" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#495057">
    Raspberry Pi 5
  </text>

  <!-- Microphone -->
  <circle cx="225" cy="150" r="25" fill="#17a2b8" stroke="#117a8b" stroke-width="2"/>
  <text x="225" y="155" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#fff">🎤</text>
  <text x="225" y="195" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
    USB Microphone
  </text>

  <!-- Arrow from microphone to wake word -->
  <path d="M 225 195 L 225 220" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Wake Word Detection -->
  <rect x="125" y="220" width="200" height="60" rx="8" fill="#28a745" stroke="#1e7e34" stroke-width="2"/>
  <text x="225" y="243" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    Wake Word Detection
  </text>
  <text x="225" y="260" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#d4edda">
    Vosk (Offline)
  </text>
  <text x="225" y="273" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#d4edda">
    "Hey Tidal"
  </text>

  <!-- Arrow from wake word to speech recognition -->
  <path d="M 225 280 L 225 305" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Speech Recognition -->
  <rect x="125" y="305" width="200" height="55" rx="8" fill="#007bff" stroke="#0056b3" stroke-width="2"/>
  <text x="225" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    Speech Recognition
  </text>
  <text x="225" y="342" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#cce5ff">
    Vosk (Spanish)
  </text>
  <text x="225" y="355" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#cce5ff">
    Speech → Text
  </text>

  <!-- Arrow from speech recognition to command parser -->
  <path d="M 225 360 L 225 380" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Command Parser -->
  <rect x="125" y="380" width="200" height="50" rx="8" fill="#6610f2" stroke="#520dc2" stroke-width="2"/>
  <text x="225" y="402" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    Command Parser
  </text>
  <text x="225" y="418" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e0cffc">
    Extract: song, artist, album
  </text>

  <!-- Arrow from command parser to Tidal player -->
  <path d="M 225 430 L 225 455" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Tidal Player -->
  <rect x="125" y="455" width="200" height="55" rx="8" fill="#fd7e14" stroke="#e8590c" stroke-width="2"/>
  <text x="225" y="475" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    Tidal Player
  </text>
  <text x="225" y="492" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ffe5d0">
    Search &amp; Stream
  </text>
  <text x="225" y="505" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffe5d0">
    PyChromecast
  </text>

  <!-- Arrow from Tidal Player to Tidal API -->
  <path d="M 325 470 L 380 470 L 380 260 L 420 260" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Tidal API (External) -->
  <rect x="420" y="220" width="160" height="80" rx="8" fill="#000" stroke="#333" stroke-width="2"/>
  <text x="500" y="245" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">
    TIDAL
  </text>
  <text x="500" y="265" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#999">
    Music Streaming API
  </text>
  <text x="500" y="280" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
    Search tracks, artists,
  </text>
  <text x="500" y="293" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
    albums, get stream URLs
  </text>

  <!-- Arrow from Tidal Player to Nest Mini -->
  <path d="M 325 495 L 380 495 L 380 400 L 420 400" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="385" y="445" font-family="Arial, sans-serif" font-size="9" fill="#6c757d">
    Cast audio
  </text>

  <!-- Google Nest Mini -->
  <rect x="420" y="350" width="160" height="100" rx="8" fill="#4285f4" stroke="#1a73e8" stroke-width="2"/>
  <text x="500" y="375" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    Google
  </text>
  <text x="500" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    Nest Mini
  </text>
  <text x="500" y="413" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#d2e3fc">
    Chromecast Receiver
  </text>
  <text x="500" y="430" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">🔊</text>

  <!-- User -->
  <circle cx="80" cy="150" r="30" fill="#6c757d" stroke="#495057" stroke-width="2"/>
  <text x="80" y="160" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">👤</text>
  <text x="80" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
    Jorge
  </text>

  <!-- Voice command arrow -->
  <path d="M 110 145 L 190 145" stroke="#28a745" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead-green)"/>
  <text x="150" y="135" font-family="Arial, sans-serif" font-size="9" fill="#28a745" text-anchor="middle">
    "Hey Tidal, pon música"
  </text>

  <!-- Music output arrow -->
  <path d="M 580 400 L 680 400" stroke="#4285f4" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <text x="680" y="405" font-family="Arial, sans-serif" font-size="24">🎵</text>
  <text x="680" y="425" font-family="Arial, sans-serif" font-size="10" fill="#495057">Music</text>

  <!-- Network indicator -->
  <rect x="620" y="70" width="160" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="700" y="90" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#856404">
    📡 WiFi Network Required
  </text>
  <text x="700" y="103" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#856404">
    (Pi ↔ Tidal ↔ Nest Mini)
  </text>

  <!-- Key Features Box -->
  <rect x="620" y="220" width="160" height="110" rx="5" fill="#d1ecf1" stroke="#17a2b8" stroke-width="2"/>
  <text x="700" y="238" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0c5460">
    ✨ Key Features
  </text>
  <text x="630" y="255" font-family="Arial, sans-serif" font-size="9" fill="#0c5460">
    ✓ 100% Offline Wake Word
  </text>
  <text x="630" y="270" font-family="Arial, sans-serif" font-size="9" fill="#0c5460">
    ✓ Spanish Recognition
  </text>
  <text x="630" y="285" font-family="Arial, sans-serif" font-size="9" fill="#0c5460">
    ✓ No External APIs
  </text>
  <text x="630" y="300" font-family="Arial, sans-serif" font-size="9" fill="#0c5460">
    ✓ Full Privacy
  </text>
  <text x="630" y="315" font-family="Arial, sans-serif" font-size="9" fill="#0c5460">
    ✓ Lossless Audio
  </text>

  <!-- Footer -->
  <text x="400" y="575" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6c757d">
    Voice-controlled Tidal playback on Google Nest Mini via Raspberry Pi 5
  </text>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6c757d" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#28a745" />
    </marker>
  </defs>
</svg>
