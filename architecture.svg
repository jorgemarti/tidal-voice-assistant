<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <!-- Background -->
  <rect width="900" height="550" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#212529">
    Tidal Voice Assistant Architecture
  </text>

  <!-- User -->
  <circle cx="70" cy="200" r="35" fill="#6c757d" stroke="#495057" stroke-width="2"/>
  <text x="70" y="210" font-family="Arial, sans-serif" font-size="30" text-anchor="middle">👤</text>
  <text x="70" y="255" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">User</text>

  <!-- Voice command speech bubble -->
  <rect x="110" y="130" width="130" height="45" rx="8" fill="#e8f5e9" stroke="#28a745" stroke-width="1.5"/>
  <text x="175" y="150" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2e7d32">"Hey Tidal,</text>
  <text x="175" y="165" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2e7d32">pon música"</text>
  <!-- Speech bubble pointer -->
  <polygon points="120,175 110,190 130,175" fill="#e8f5e9" stroke="#28a745" stroke-width="1.5"/>

  <!-- Raspberry Pi 5 Container -->
  <rect x="250" y="70" width="220" height="420" rx="12" fill="#fff" stroke="#c62828" stroke-width="3"/>
  <rect x="250" y="70" width="220" height="35" rx="12" fill="#c62828"/>
  <text x="360" y="93" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    🍓 Raspberry Pi 5
  </text>

  <!-- Microphone -->
  <circle cx="360" cy="145" r="22" fill="#17a2b8" stroke="#117a8b" stroke-width="2"/>
  <text x="360" y="152" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#fff">🎤</text>
  <text x="360" y="182" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">Microphone</text>

  <!-- Arrow: User to Microphone -->
  <path d="M 105 200 L 250 200 L 250 145 L 335 145" stroke="#28a745" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>

  <!-- Arrow: Microphone to Wake Word -->
  <line x1="360" y1="190" x2="360" y2="210" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Wake Word Detection -->
  <rect x="275" y="215" width="170" height="55" rx="8" fill="#28a745" stroke="#1e7e34" stroke-width="2"/>
  <text x="360" y="237" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Wake Word Detection</text>
  <text x="360" y="253" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#c8e6c9">Vosk · "Hey Tidal"</text>
  <text x="360" y="265" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#a5d6a7">100% Offline</text>

  <!-- Arrow: Wake Word to Speech Recognition -->
  <line x1="360" y1="270" x2="360" y2="285" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Speech Recognition -->
  <rect x="275" y="290" width="170" height="50" rx="8" fill="#1976d2" stroke="#0d47a1" stroke-width="2"/>
  <text x="360" y="312" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Speech Recognition</text>
  <text x="360" y="328" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#bbdefb">Vosk · Spanish (es-ES)</text>

  <!-- Arrow: Speech Recognition to Command Parser -->
  <line x1="360" y1="340" x2="360" y2="355" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Command Parser -->
  <rect x="275" y="360" width="170" height="45" rx="8" fill="#7b1fa2" stroke="#4a148c" stroke-width="2"/>
  <text x="360" y="380" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Command Parser</text>
  <text x="360" y="395" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e1bee7">song · artist · album</text>

  <!-- Arrow: Command Parser to Tidal Player -->
  <line x1="360" y1="405" x2="360" y2="420" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tidal Player -->
  <rect x="275" y="425" width="170" height="50" rx="8" fill="#e65100" stroke="#bf360c" stroke-width="2"/>
  <text x="360" y="447" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Tidal Player</text>
  <text x="360" y="463" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffe0b2">PyChromecast</text>

  <!-- TIDAL API Box -->
  <rect x="550" y="120" width="150" height="90" rx="8" fill="#000" stroke="#333" stroke-width="2"/>
  <text x="625" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">TIDAL</text>
  <text x="625" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#bbb">Music Streaming API</text>
  <text x="625" y="195" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#888">Search · Stream URLs</text>

  <!-- Arrow: Tidal Player to TIDAL API -->
  <path d="M 445 450 L 500 450 L 500 165 L 550 165" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="508" y="310" font-family="Arial, sans-serif" font-size="9" fill="#666" transform="rotate(-90,508,310)">API Requests</text>

  <!-- Google Nest Mini -->
  <rect x="550" y="280" width="150" height="100" rx="8" fill="#4285f4" stroke="#1a73e8" stroke-width="2"/>
  <text x="625" y="310" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">Google</text>
  <text x="625" y="328" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">Nest Mini</text>
  <text x="625" y="348" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#c5cae9">Chromecast Receiver</text>
  <text x="625" y="368" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">🔊</text>

  <!-- Arrow: Tidal Player to Nest Mini -->
  <path d="M 445 460 L 480 460 L 480 330 L 550 330" stroke="#4285f4" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="488" y="400" font-family="Arial, sans-serif" font-size="9" fill="#4285f4" transform="rotate(-90,488,400)">Cast Audio</text>

  <!-- Music output -->
  <path d="M 700 330 L 780 330" stroke="#4285f4" stroke-width="2" fill="none" stroke-dasharray="6,3"/>
  <text x="800" y="320" font-family="Arial, sans-serif" font-size="28">🎵</text>
  <text x="800" y="350" font-family="Arial, sans-serif" font-size="11" fill="#495057">Music!</text>

  <!-- Key Features Box -->
  <rect x="550" y="410" width="150" height="100" rx="6" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5"/>
  <text x="625" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1565c0">✨ Key Features</text>
  <text x="560" y="448" font-family="Arial, sans-serif" font-size="9" fill="#1565c0">✓ Fully Offline Wake Word</text>
  <text x="560" y="462" font-family="Arial, sans-serif" font-size="9" fill="#1565c0">✓ Spanish Recognition</text>
  <text x="560" y="476" font-family="Arial, sans-serif" font-size="9" fill="#1565c0">✓ No External API Keys</text>
  <text x="560" y="490" font-family="Arial, sans-serif" font-size="9" fill="#1565c0">✓ Lossless Audio Quality</text>
  <text x="560" y="504" font-family="Arial, sans-serif" font-size="9" fill="#1565c0">✓ Full Privacy</text>

  <!-- Network indicator -->
  <rect x="730" y="70" width="150" height="35" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="805" y="92" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#e65100">📡 Same WiFi Network</text>

  <!-- Footer -->
  <text x="450" y="535" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#9e9e9e">
    Voice-controlled Tidal playback on Google Nest Mini via Raspberry Pi 5
  </text>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#28a745"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4285f4"/>
    </marker>
  </defs>
</svg>
